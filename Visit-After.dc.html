<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>После приёма</title>
<meta name="viewport" content="width=393, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#F5F6F3}body{display:flex;justify-content:center}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="ds/emirmed/tokens.css">
<link rel="stylesheet" href="ds/emirmed/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/emirmed/components/bundle.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<template id="dc">
<helmet>
<style>
body{margin:0}
a{color:#17644a}a:hover{color:#0e3b2d}
</style>
</helmet>
<div class="app">
  <div class="scroll scroll--end">
    <div class="rel">
      <x-import component-from-global-scope="EmirMed.TopBar" variant="nav" title="После приёма" action="file" action-label="Заключение PDF"></x-import>
      <a class="hit-left" href="Home-Returning.dc.html" aria-label="Назад"></a>
    </div>
    <x-import component-from-global-scope="EmirMed.AiCard" label="План простыми словами" title="ОРВИ, ничего опасного" aside="Педиатр · Айлин">
      <ul class="em-plan">
        <li>Больше пить и проветривать комнату</li>
        <li>Капли в нос 3 раза в день — 5 дней</li>
        <li>Температура выше 39 или вялость — сразу звоните</li>
      </ul>
    </x-import>
    <x-import component-from-global-scope="EmirMed.MedReminder" title="Назначения" course="Напомним в приложении" items="{{ meds }}"></x-import>
    <div class="list">
      <a class="row" href="Book-Slot.dc.html">
        <img class="ico" src="img/calendar.svg" alt="">
        <span class="row__body"><span class="row__t">Повторный осмотр через 7 дней</span><span class="row__s">Выберите время — напомним заранее</span></span>
        <span class="row__go"><x-import component-from-global-scope="EmirMed.Icon" name="chevron-right" size="{{ s20 }}"></x-import></span>
      </a>
      <a class="row" href="Visit-Rate.dc.html">
        <img class="ico" src="img/star.svg" alt="">
        <span class="row__body"><span class="row__t">Как прошёл визит?</span><span class="row__s">10 секунд — прочитает руководитель филиала</span></span>
        <span class="row__go"><x-import component-from-global-scope="EmirMed.Icon" name="chevron-right" size="{{ s20 }}"></x-import></span>
      </a>
    </div>
  </div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    return {
      s20: 20,
      meds: [
        { time: '08:00', name: 'Капли в нос', note: 'Утро · день · вечер', taken: !!st.drops, onToggle: () => this.setState({ drops: !st.drops }) },
        { time: '21:00', name: 'Витамин D3', note: 'После ужина', taken: !!st.vit, onToggle: () => this.setState({ vit: !st.vit }) }
      ]
    };
  }
}
</script>
</body>
</html>
