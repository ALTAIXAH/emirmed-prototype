<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная · записан и наблюдается</title>
<meta name="viewport" content="width=393, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#F5F6F3}body{display:flex;justify-content:center}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="ds/emirmed/tokens.css">
<link rel="stylesheet" href="ds/emirmed/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/emirmed/components/bundle.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<template id="dc">
<helmet>
<style>
body{margin:0}
a{color:#17644a}a:hover{color:#0e3b2d}
</style>
</helmet>
<div class="app">
  <div class="scroll">
    <x-import component-from-global-scope="EmirMed.TopBar" greeting="Доброе утро," name="Алия" city="Алматы" unread="{{ yes }}"></x-import>
    <div class="rel">
      <x-import component-from-global-scope="EmirMed.Stories" label="Памятки" items="{{ stories }}"></x-import>
      <a class="hit" href="Story.dc.html" aria-label="Открыть сторис"></a>
    </div>

    <section class="hero">
      <div>
        <div class="hero__eyebrow">Через 2 дня · оплачено</div>
        <h2 class="hero__t">Пт, 16 октября · 10:30</h2>
        <p class="hero__s">Айлин · педиатр Саяндинова Н. А. · каб. 214</p>
      </div>
      <div class="hero__btns">
        <a class="em-btn em-btn--inverse em-btn--md" href="Visit-Pass.dc.html">Пропуск</a>
        <button type="button" class="em-btn em-btn--md em-btn--soft">Перенести</button>
      </div>
    </section>

    <div class="list">
      <a class="row" href="Docs-Sign.dc.html">
        <img class="ico" src="img/results.svg" alt="">
        <span class="row__body"><span class="row__t">Документы к визиту</span><span class="row__s">3 на подпись · eGov mobile</span></span>
        <span class="tag tag--warn">Ждёт</span>
      </a>
      <div class="row">
        <img class="ico" src="img/heart.svg" alt="">
        <span class="row__body">
          <span class="row__t">Давление: {{ bp }}</span>
          <sc-if value="{{ bpSaved }}" hint-placeholder-val="{{ no }}"><span class="row__ok popin">Записано только что · врач увидит</span></sc-if>
          <sc-if value="{{ bpOld }}" hint-placeholder-val="{{ yes }}"><span class="row__ok">В цели врача · неделя 6 из 12</span></sc-if>
        </span>
        <x-import component-from-global-scope="EmirMed.Button" variant="secondary" size="sm" icon="plus" aria-label="Внести давление" on-click="{{ openBp }}"></x-import>
      </div>
      <a class="row" href="Visit-After.dc.html">
        <img class="ico" src="img/pill.svg" alt="">
        <span class="row__body"><span class="row__t">Лекарства: 1 из 2</span><span class="row__s">Следующее в 21:00</span></span>
        <span class="row__go"><x-import component-from-global-scope="EmirMed.Icon" name="chevron-right" size="{{ s20 }}"></x-import></span>
      </a>
    </div>

    <div class="sec"><h2>Записаться к врачу</h2></div>
    <a class="ask" href="Book-Doctors.dc.html">
      <x-import component-from-global-scope="EmirMed.Icon" name="search" size="{{ s20 }}"></x-import>
      <span>Педиатр, УЗИ, анализы…</span>
      <span class="ask__go"><x-import component-from-global-scope="EmirMed.Icon" name="arrow-right" size="{{ s18 }}"></x-import></span>
    </a>
    <div class="dirs">
      <sc-for list="{{ dirs }}" as="d" hint-placeholder-count="6">
        <a class="dir" href="Book-Doctors.dc.html"><img src="{{ d.img }}" alt=""><span>{{ d.label }}</span></a>
      </sc-for>
    </div>

    <div class="sec"><h2>Акции для вас</h2><a href="Bonus.dc.html">Все</a></div>
    <div class="banners">
      <a class="banner banner--deep" href="Story.dc.html">
        <img class="banner__photo" src="img/mri.jpg" alt="">
        <span class="banner__badge">−20%</span>
        <span><span class="banner__t">МРТ с выгодой</span><span class="banner__s">Специальная цена до конца октября</span></span>
      </a>
      <a class="banner banner--rose" href="Bonus.dc.html">
        <img class="banner__art" src="img/labs.svg" alt="">
        <span class="banner__badge">−20%</span>
        <span><span class="banner__t">Месяц анализов</span><span class="banner__s">На все анализы до 31 октября</span></span>
      </a>
      <a class="banner banner--oak" href="Bonus.dc.html">
        <img class="banner__art" src="img/dentist.svg" alt="">
        <span class="banner__badge">Ночью</span>
        <span><span class="banner__t">КТ зубов дешевле</span><span class="banner__s">С 17:00 до 10:00 — 15 600 ₸</span></span>
      </a>
    </div>
    <div class="dotsbar" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

    <div class="list">
      <a class="row" href="Bonus.dc.html">
        <img class="ico" src="img/gift.svg" alt="">
        <span class="row__body"><span class="row__t">Карта EMIRMED</span><span class="row__s">2 450 бонусов · скидка 10%</span></span>
        <span class="row__go"><x-import component-from-global-scope="EmirMed.Icon" name="chevron-right" size="{{ s20 }}"></x-import></span>
      </a>
      <a class="row" href="AI-Chat.dc.html">
        <img class="ico" src="img/assistant.svg" alt="">
        <span class="row__body"><span class="row__t">Вопрос между визитами</span><span class="row__s">Медсестра ответит в течение дня</span></span>
        <span class="row__go"><x-import component-from-global-scope="EmirMed.Icon" name="chevron-right" size="{{ s20 }}"></x-import></span>
      </a>
    </div>
  </div>
  <div class="em-screen__fade" style="height: 104px;"></div>
  <div class="em-screen__tab"><x-import component-from-global-scope="EmirMed.TabBar" default-value="home"></x-import></div>
  <nav class="tablinks" aria-label="Разделы">
    <a href="Home-Care.dc.html" aria-label="Главная"></a>
    <a href="Visit-Pass.dc.html" aria-label="Визиты"></a>
    <a href="Book-Doctors.dc.html" aria-label="Записаться"></a>
    <a href="Health.dc.html" aria-label="Здоровье"></a>
    <a href="Profile.dc.html" aria-label="Профиль"></a>
  </nav>

  <sc-if value="{{ showForm }}" hint-placeholder-val="{{ no }}">
    <div class="overlay">
      <div class="sheet sheet--form">
        <h2 class="sheet__t">Давление сейчас</h2>
        <p class="sheet__s">Измеряйте сидя, после 5 минут отдыха</p>
        <div class="fields">
          <x-import component-from-global-scope="EmirMed.TextField" label="Верхнее" default-value="126"></x-import>
          <x-import component-from-global-scope="EmirMed.TextField" label="Нижнее" default-value="80"></x-import>
        </div>
        <button type="button" class="em-btn em-btn--primary em-btn--block" onClick="{{ saveBp }}">Сохранить</button>
        <button type="button" class="em-btn em-btn--ghost em-btn--md em-btn--block" onClick="{{ closeBp }}">Отмена</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showSaved }}" hint-placeholder-val="{{ no }}">
    <div class="overlay">
      <div class="sheet">
        <div class="okmark" aria-hidden="true"><span class="okmark__ring"></span><span class="okmark__ring"></span><span class="okmark__disc"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M11 21l6 6 12-13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div>
        <h2 class="sheet__t">Записали 126/80</h2>
        <p class="sheet__s">В цели врача. Маткасимов Р. Ж. увидит запись в карте наблюдения.</p>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const st = this.state || {};
    const stage = st.stage || 'none';
    return {
      yes: true,
      no: false,
      s18: 18,
      s20: 20,
      bp: st.saved ? '126/80' : '128/82',
      bpSaved: !!st.saved,
      bpOld: !st.saved,
      showForm: stage === 'form',
      showSaved: stage === 'saved',
      openBp: () => this.setState({ stage: 'form' }),
      closeBp: () => this.setState({ stage: 'none' }),
      saveBp: () => {
        this.setState({ stage: 'saved' });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ stage: 'none', saved: true }), 1700);
      },
      stories: [
        { label: 'К приёму', icon: 'stethoscope', tone: 'emerald' },
        { label: 'Давление', icon: 'heart', tone: 'oak' },
        { label: 'Акции', image: 'img/mri.jpg', badge: '−20%' },
        { label: 'Ребёнок', image: 'img/pediatrics.jpg' },
        { label: 'Филиал', image: 'img/branch-nusupbekova.jpg', seen: true }
      ],
      dirs: [
        { label: 'Педиатр', img: 'img/pediatr.svg' },
        { label: 'Терапевт', img: 'img/therapist.svg' },
        { label: 'Кардиолог', img: 'img/heart.svg' },
        { label: 'Анализы', img: 'img/labs.svg' },
        { label: 'УЗИ', img: 'img/ultrasound.svg' },
        { label: 'МРТ', img: 'img/mri-icon.svg' },
        { label: 'Стоматолог', img: 'img/dentist.svg' },
        { label: 'Врач на дом', img: 'img/home.svg' },
        { label: 'Онлайн', img: 'img/online.svg' }
      ]
    };
  }
}
</script>
</body>
</html>
