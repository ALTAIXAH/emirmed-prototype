<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Запись · время</title>
<meta name="viewport" content="width=393, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#F5F6F3}body{display:flex;justify-content:center}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<link rel="stylesheet" href="ds/emirmed/tokens.css">
<link rel="stylesheet" href="ds/emirmed/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/emirmed/components/bundle.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<template id="dc">
<helmet>
<style>
body{margin:0}
a{color:#17644a}a:hover{color:#0e3b2d}
</style>
</helmet>
<div class="app">
  <div class="scroll scroll--dock">
    <div class="rel">
      <x-import component-from-global-scope="EmirMed.TopBar" variant="nav" title="Время приёма"></x-import>
      <a class="hit-left" href="Book-Doctors.dc.html" aria-label="Назад"></a>
    </div>
    <div class="list">
      <div class="row">
        <x-import component-from-global-scope="EmirMed.Avatar" src="img/sayandinova.jpg" name="Саяндинова Назгуль" size="{{ s48 }}" zoom="{{ zoom }}" focus="50% 36%"></x-import>
        <span class="row__body"><span class="row__t">Саяндинова Назгуль Абильевна</span><span class="row__s">Педиатр · Нусупбекова, 26/1</span></span>
      </div>
    </div>
    <div style="display: grid; gap: 8px;">
      <span class="em-slots__label">Кого записываем</span>
      <div class="em-row">
        <x-import component-from-global-scope="EmirMed.Chip" icon="heart" selected="{{ yes }}">Айлин, 4 года</x-import>
        <x-import component-from-global-scope="EmirMed.Chip" icon="user">Арман</x-import>
        <x-import component-from-global-scope="EmirMed.Chip" icon="user">Я</x-import>
      </div>
    </div>
    <x-import component-from-global-scope="EmirMed.SlotPicker" days="{{ days }}" day="16" groups="{{ groups }}" default-value="10:30"></x-import>
  </div>
  <div class="em-screen__dock">
    <div class="em-screen__total"><b>7 000 ₸</b><span>Пт, 16 окт · 10:30</span></div>
    <a class="em-btn em-btn--primary" href="Book-Pay.dc.html">Продолжить</a>
  </div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      s48: 48,
      zoom: 2.4,
      days: [
        { id: '14', weekday: 'ср', date: '14' }, { id: '15', weekday: 'чт', date: '15' }, { id: '16', weekday: 'пт', date: '16' },
        { id: '17', weekday: 'сб', date: '17' }, { id: '18', weekday: 'вс', date: '18', disabled: true }, { id: '19', weekday: 'пн', date: '19' }
      ],
      groups: [
        { label: 'Утро', slots: [{ time: '08:30', busy: true }, '09:00', { time: '09:30', busy: true }, '10:00', '10:30', { time: '11:00', busy: true }, '11:30', '12:00'] },
        { label: 'День', slots: ['14:00', { time: '14:30', busy: true }, '15:00', '15:30'] }
      ]
    };
  }
}
</script>
</body>
</html>
